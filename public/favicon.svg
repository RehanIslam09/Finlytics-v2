<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a12"></stop>
      <stop offset="100%" stop-color="#1a1033"></stop>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"></stop>
      <stop offset="100%" stop-color="#c084fc"></stop>
    </linearGradient>
  </defs>

  <!-- Rounded square -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"></rect>

  <!-- Glow -->
  <rect width="64" height="64" rx="16" fill="none" stroke="#8b5cf6" stroke-opacity="0.2" stroke-width="2"></rect>

  <!-- FX text -->
  <g fill="url(#accent)" font-family="JetBrains Mono, monospace" font-weight="700">
    <text x="18" y="42" font-size="28" letter-spacing="-2">F</text>
    <text x="34" y="42" font-size="28" letter-spacing="-2">X</text>
  </g>

  <!-- Subtle upward line (finance hint) -->
  <path d="M14 40 L26 30 L34 34 L48 22" fill="none" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round" opacity="0.6"></path>

  <!-- Arrow -->
  <polygon points="48,22 46,16 54,20" fill="#c084fc" opacity="0.8"></polygon>
</svg>